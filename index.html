<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>健身训练助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { overflow-x:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    background:#0b0d14; color:#f5f7fa; min-height:100vh;
  }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; }
  #app {
    max-width:480px; margin:0 auto; min-height:100vh; position:relative;
    background:#0e1018;
    background-image:
      radial-gradient(1000px 500px at 85% -5%, rgba(240,127,87,.14), transparent 60%),
      radial-gradient(800px 500px at -10% 30%, rgba(99,72,191,.12), transparent 60%);
    background-attachment:fixed;
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }

  /* ===== Hero 渐变区（首页 / 详情页头部） ===== */
  .hero {
    position:relative; padding:calc(22px + env(safe-area-inset-top)) 20px 30px; overflow:hidden;
    background:linear-gradient(168deg,#221c46 0%,#4a2a5a 34%,#8f3d55 62%,#d96b4f 84%,#f2a65a 100%);
  }
  .hero::after {
    content:""; position:absolute; left:0; right:0; bottom:-2px; height:110px; pointer-events:none;
    background:
      linear-gradient(135deg, transparent 62%, rgba(255,255,255,.06) 62.5%) left/55% 100% no-repeat,
      linear-gradient(-150deg, transparent 55%, rgba(13,16,24,.55) 55.5%) right/70% 100% no-repeat,
      linear-gradient(to top, #0e1018 4%, rgba(14,16,24,0) 90%);
    clip-path:polygon(0 100%,0 62%,12% 40%,24% 58%,38% 22%,52% 52%,66% 30%,80% 55%,92% 38%,100% 50%,100% 100%);
  }
  .hero > * { position:relative; z-index:2; }
  .h-top { display:flex; align-items:center; justify-content:space-between; }
  .badge { font-size:11px; padding:4px 11px; border-radius:99px; color:#ffe8cf;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px); }
  .gear { width:34px; height:34px; border-radius:12px; background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .hero .greet { font-size:12px; color:rgba(255,255,255,.72); letter-spacing:1px; }
  .hero h2 { font-size:29px; font-weight:800; margin:10px 0 4px; letter-spacing:1px; text-shadow:0 2px 18px rgba(0,0,0,.3); }
  .hero .sub { font-size:12.5px; color:rgba(255,255,255,.78); }
  .stats { display:flex; gap:10px; margin-top:18px; }
  .mini-stat { flex:1; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(12px); border-radius:14px; padding:10px 12px; min-width:0; }
  .mini-stat .k { font-size:10.5px; color:rgba(255,255,255,.75); }
  .mini-stat .v { font-size:15px; font-weight:700; margin-top:2px; white-space:nowrap; }
  .mini-stat .v i { font-style:normal; font-size:10.5px; color:rgba(255,255,255,.65); font-weight:400; }
  .ring { width:52px; height:52px; border-radius:50%; flex-shrink:0; align-self:center;
    background:conic-gradient(#ffd9a0 0 0%, rgba(255,255,255,.18) 0 100%);
    display:flex; align-items:center; justify-content:center; }
  .ring i { width:40px; height:40px; border-radius:50%; background:#3a2a44; font-style:normal;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }

  /* ===== 内容区 ===== */
  .content { padding:16px 16px calc(104px + env(safe-area-inset-bottom)); }
  .sec-title { font-size:13px; color:rgba(255,255,255,.55); margin:12px 4px 10px; letter-spacing:1px; }

  /* 毛玻璃卡片 */
  .g-card {
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:18px; padding:16px; margin-bottom:12px;
  }
  .entry { display:flex; align-items:center; gap:14px; }
  .entry .ico { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
    background:linear-gradient(150deg, rgba(242,166,90,.25), rgba(201,75,94,.2)); border:1px solid rgba(242,166,90,.3); }
  .entry .ico.g2 { background:linear-gradient(150deg, rgba(126,240,196,.18), rgba(72,140,191,.18)); border-color:rgba(126,240,196,.28); }
  .entry .ico.g3 { background:linear-gradient(150deg, rgba(196,132,252,.2), rgba(99,72,191,.18)); border-color:rgba(196,132,252,.3); }
  .entry .t { flex:1; min-width:0; }
  .entry .t b { font-size:16px; display:block; }
  .entry .t span { font-size:11.5px; color:rgba(255,255,255,.55); }
  .entry .arrow { color:rgba(255,255,255,.35); font-size:18px; }

  /* 部位卡网格 */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .part { border-radius:16px; padding:14px; position:relative; overflow:hidden; display:block;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); }
  .part b { font-size:15px; display:block; margin-top:26px; }
  .part span { font-size:10.5px; color:rgba(255,255,255,.5); }
  .part::before { content:""; position:absolute; width:70px; height:70px; border-radius:50%; top:-24px; right:-20px;
    background:radial-gradient(circle, rgba(242,166,90,.35), transparent 70%); }
  .part:nth-child(3n+2)::before { background:radial-gradient(circle, rgba(126,240,196,.3), transparent 70%); }
  .part:nth-child(3n)::before { background:radial-gradient(circle, rgba(196,132,252,.3), transparent 70%); }

  /* ===== 底部悬浮胶囊 Dock ===== */
  .dock {
    position:fixed; left:50%; transform:translateX(-50%);
    width:min(452px, calc(100% - 28px));
    bottom:calc(14px + env(safe-area-inset-bottom)); z-index:50;
    display:flex; background:rgba(20,22,32,.72); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:99px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .dock a { flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
    font-size:10.5px; color:rgba(255,255,255,.5); padding:6px 0 5px; border-radius:99px; }
  .dock a i { font-style:normal; font-size:17px; line-height:1.2; }
  .dock a.on { color:#0e1018; background:linear-gradient(120deg,#ffd9a0,#f2a65a); font-weight:700; }

  /* ===== 子页顶栏 ===== */
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:6px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    background:rgba(14,16,24,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.06); }
  .topbar .back { font-size:22px; line-height:1; color:rgba(255,255,255,.8); padding:0 8px 2px 2px; cursor:pointer; }
  .topbar h1 { font-size:17px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .r-act { font-size:12.5px; color:#ffd9a0; padding:4px 6px; cursor:pointer; }

  /* ===== 动作详情 ===== */
  .d-hero { position:relative; padding:calc(14px + env(safe-area-inset-top)) 20px 22px; overflow:hidden;
    background:linear-gradient(160deg,#1d2742 0%,#3a2a5a 45%,#7a3a52 75%,#c96a4e 100%); }
  .d-hero .back { font-size:12.5px; color:rgba(255,255,255,.85); cursor:pointer; position:relative; z-index:2; }
  .d-hero .fig { height:150px; margin:12px 0 8px; display:flex; align-items:center; justify-content:center; position:relative; z-index:2; }
  .d-hero .fig svg { max-height:100%; }
  .d-hero h2 { font-size:26px; font-weight:800; letter-spacing:1px; position:relative; z-index:2; }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; position:relative; z-index:2; }
  .chip { font-size:10.5px; padding:4px 11px; border-radius:99px; color:#ffe8cf;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px); }
  .chip.lv0 { color:#bff3dd; border-color:rgba(126,240,196,.35); }
  .sets-line { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .sets-line b { font-size:22px; background:linear-gradient(90deg,#ffd9a0,#ff9f7a);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sets-line span { font-size:11.5px; color:rgba(255,255,255,.55); }
  .card-t { font-size:13px; color:rgba(255,255,255,.55); letter-spacing:1px; margin-bottom:8px; }
  .step { display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed rgba(255,255,255,.08); }
  .step:last-child { border-bottom:none; }
  .step i { width:22px; height:22px; border-radius:50%; flex-shrink:0; font-style:normal; font-size:11px; font-weight:700;
    background:linear-gradient(120deg,#ffd9a0,#f2955a); color:#1a1206;
    display:flex; align-items:center; justify-content:center; }
  .step p { font-size:13px; color:rgba(255,255,255,.88); line-height:1.6; }
  .dot-line { display:flex; gap:10px; padding:6px 0; }
  .dot-line::before { content:""; width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:7px;
    background:linear-gradient(120deg,#ffd9a0,#f2955a); }
  .dot-line p { font-size:13px; color:rgba(255,255,255,.88); line-height:1.6; }
  .tip-card { border-radius:16px; padding:14px 16px; font-size:12.5px; margin-bottom:12px; line-height:1.7;
    background:linear-gradient(120deg, rgba(242,166,90,.14), rgba(201,75,94,.1));
    border:1px solid rgba(242,166,90,.28); color:#ffd9b0; }
  .video-btn { display:block; text-align:center; padding:13px; border-radius:14px; font-size:13.5px; font-weight:600;
    color:#ffd9a0; border:1px solid rgba(255,217,160,.4); background:rgba(255,217,160,.08); margin-bottom:12px; }

  /* ===== 列表行（动作 / 食物 / 记录） ===== */
  .row { display:flex; align-items:center; gap:12px; }
  .row .thumb { width:56px; height:44px; border-radius:12px; flex-shrink:0; overflow:hidden;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center; }
  .row .thumb svg { width:100%; height:100%; }
  .row .t { flex:1; min-width:0; }
  .row .t b { font-size:14.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .t span { font-size:11px; color:rgba(255,255,255,.55); }
  .row .arrow { color:rgba(255,255,255,.35); font-size:17px; }
  .tag { font-size:10px; padding:2px 8px; border-radius:99px; margin-left:6px; white-space:nowrap; }
  .tag.lv0 { color:#bff3dd; background:rgba(126,240,196,.12); border:1px solid rgba(126,240,196,.3); }
  .tag.lv1 { color:#ffe8cf; background:rgba(242,166,90,.12); border:1px solid rgba(242,166,90,.3); }
  .gray { opacity:.42; }

  .mrow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed rgba(255,255,255,.08); }
  .mrow:last-child { border-bottom:none; }
  .mrow .t { flex:1; min-width:0; }
  .mrow .t b { font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow .t span { font-size:11px; color:rgba(255,255,255,.55); }
  .mrow .v { font-size:12px; color:#ffd9a0; white-space:nowrap; text-align:right; }
  .mrow .v span { display:block; font-size:10.5px; color:rgba(255,255,255,.5); }
  .mrow .del { color:rgba(255,255,255,.35); font-size:17px; padding:4px 6px; cursor:pointer; flex-shrink:0; }
  .meal-head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .meal-head b { font-size:15px; }
  .meal-head .kcal { font-size:11px; color:rgba(255,255,255,.5); }
  .meal-head .add { margin-left:auto; font-size:12.5px; color:#ffd9a0; padding:4px 6px; cursor:pointer; }

  .bar { height:8px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#ffd9a0,#f2955a); transition:width .3s; }
  .sum-row { display:flex; gap:14px; }
  .sum-row > div { flex:1; min-width:0; }
  .sum-num { font-size:20px; font-weight:800; }
  .sum-num i { font-style:normal; font-size:11px; color:rgba(255,255,255,.55); font-weight:400; }
  .over { color:#ff9f7a !important; }

  /* ===== 表单 ===== */
  .inp { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:12px 14px; color:#fff; font-size:14px; outline:none; font-family:inherit; }
  .inp:focus { border-color:rgba(242,166,90,.5); }
  .inp::placeholder { color:rgba(255,255,255,.3); }
  .btn { display:block; width:100%; text-align:center; padding:13px; border-radius:14px; font-size:14px; font-weight:700;
    border:none; cursor:pointer; color:#1a1206; background:linear-gradient(120deg,#ffd9a0,#f2955a); }
  .btn[disabled] { opacity:.4; }
  .btn-ghost { background:rgba(255,255,255,.07); color:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.14); }
  .btn + .btn { margin-top:10px; }
  .preset { display:inline-block; font-size:12px; padding:7px 13px; border-radius:99px; cursor:pointer; margin:0 8px 8px 0;
    color:#ffe8cf; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); }
  .preview { font-size:14px; color:#ffd9a0; }
  .preview b { font-size:18px; }

  .empty { text-align:center; color:rgba(255,255,255,.45); font-size:12.5px; padding:26px 10px; line-height:1.8; }

  /* ===== Onboarding ===== */
  .ob-card { display:block; border-radius:22px; padding:22px 20px; margin-bottom:16px; position:relative; overflow:hidden;
    background:rgba(255,255,255,.06); border:1px solid rgba(242,166,90,.35);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .ob-card.g2 { border-color:rgba(126,240,196,.32); }
  .ob-card .emo { font-size:34px; }
  .ob-card b { font-size:19px; display:block; margin:10px 0 4px; }
  .ob-card p { font-size:12.5px; color:rgba(255,255,255,.6); line-height:1.7; }
  .ob-card .go { position:absolute; right:18px; top:22px; font-size:12px; color:#ffd9a0;
    border:1px solid rgba(255,217,160,.4); border-radius:99px; padding:5px 12px; }
  .ob-cards { padding:4px 18px calc(40px + env(safe-area-inset-bottom)); margin-top:-26px; position:relative; z-index:3; }

  /* ===== 弹层 / 提示 ===== */
  .modal { position:fixed; inset:0; z-index:100; background:rgba(5,6,10,.6); backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center; }
  .modal.hide { display:none; }
  .m-box { width:min(480px,100%); background:#171a26; border:1px solid rgba(255,255,255,.12);
    border-bottom:none; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .m-box h3 { font-size:16px; margin-bottom:12px; }
  .m-btns { display:flex; gap:10px; margin-top:16px; }
  .m-btns .btn { margin-top:0; }
  .toast { position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:rgba(20,22,32,.95); border:1px solid rgba(255,255,255,.15); color:#ffd9a0;
    font-size:13px; padding:10px 18px; border-radius:99px; z-index:120;
    opacity:0; pointer-events:none; transition:opacity .25s; white-space:nowrap; }
  .toast.show { opacity:1; }
  .set-row { display:flex; align-items:center; gap:10px; }
  .set-row .inp { flex:1; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="dock" id="dock" style="display:none"></nav>
<div class="modal hide" id="modal"><div class="m-box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= 基础常量 ================= */
const LS_S = "ft_settings", LS_D = "ft_diet";
const MEALS = [
  {id:"breakfast", name:"早餐"},
  {id:"lunch",     name:"午餐"},
  {id:"dinner",    name:"晚餐"},
  {id:"snack",     name:"加餐"}
];
const MODE_NAME = {home:"居家版", gym:"健身房版"};
const LEVEL_ORD = {"初级":0, "中级":1};

const PARTS = [
  { id:"chest",  name:"胸部", subs:[
    {id:"chest_upper", name:"上胸"},{id:"chest_mid", name:"中胸"},{id:"chest_lower", name:"下胸"} ]},
  { id:"back",   name:"背部", subs:[
    {id:"back_upper", name:"上背"},{id:"back_lats", name:"背阔肌"},{id:"back_lower", name:"下背"} ]},
  { id:"shoulder", name:"肩部", subs:[
    {id:"sh_front", name:"前束"},{id:"sh_mid", name:"中束"},{id:"sh_rear", name:"后束"} ]},
  { id:"arms",   name:"手臂", subs:[
    {id:"arm_bi", name:"肱二头肌"},{id:"arm_tri", name:"肱三头肌"},{id:"arm_fore", name:"小臂"} ]},
  { id:"legs",   name:"腿部", subs:[
    {id:"leg_quad", name:"股四头肌"},{id:"leg_ham", name:"腘绳肌+臀"},{id:"leg_calf", name:"小腿"} ]},
  { id:"core",   name:"核心", subs:[
    {id:"core_up", name:"上腹"},{id:"core_low", name:"下腹"},{id:"core_side", name:"侧腹"} ]}
];
const PART_BY_ID = {}; PARTS.forEach(p=>PART_BY_ID[p.id]=p);
const SUB_BY_ID = {}; PARTS.forEach(p=>p.subs.forEach(s=>{ SUB_BY_ID[s.id]=Object.assign({partId:p.id},s); }));

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayKey(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekdayCN(){ return "周"+"日一二三四五六"[new Date().getDay()]; }

/* ================= 动作库 ================= */
const EXERCISES = [
/* ---------- 胸 · 上胸 ---------- */
{id:"pushup_decline",name:"下斜俯卧撑",subId:"chest_upper",mode:"home",equipment:"徒手",level:"中级",sets:"4 组 × 10-12 次",
 steps:["双脚搭在 30-50cm 高的凳面或床沿上，双手撑地与肩同宽，身体从头到脚绷成一条直线","屈肘缓慢下放 3 秒，至胸口接近地面，肘部与躯干约成 45°","胸部发力推起至手臂接近伸直，顶峰收缩 1 秒"],
 tips:["全程收腹夹臀，身体像一块板不塌腰","下放吸气、推起呼气","脚垫得越高，上胸刺激越强"],
 mistakes:["腰部下塌、臀部翘起","只下放一半就推起","耸肩把肩耸到耳朵边"],
 svg:"pl_decline",video:"https://search.bilibili.com/all?keyword=下斜俯卧撑教学"},
{id:"fly_floor_incline",name:"哑铃地板飞鸟（上斜角度）",subId:"chest_upper",mode:"home",equipment:"哑铃",level:"初级",sets:"3 组 × 12-15 次",
 steps:["仰卧在瑜伽垫上，屈膝踩地，双手持哑铃举在胸部正上方、掌心相对","保持肘部微屈且角度固定，双臂向体侧弧形打开，大臂接近地面即止","上胸发力，沿原弧线把哑铃环抱回起点，像环抱一棵大树"],
 tips:["想象用上臂往中间挤，而不是用手抓握","重量宁轻勿重，保持动作可控","下放慢 2-3 秒，感受胸部被拉长"],
 mistakes:["肘关节角度忽大忽小，做成了卧推","下放时哑铃砸地反弹借力","重量过大导致肩前侧不适"],

const ALIAS = {
  seat_crunch:"seat_twist"
};
function figSVG(key){
  const d = FIG[ALIAS[key]||key] || FIG.generic;
  const S = 'stroke="#ffd9a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  let s = '<svg viewBox="0 0 170 110" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">';
  if(d.p) s += d.p;
  const pl = pts => pts.map(pt=>pt.join(" ")).join(" L");
  s += '<path d="M'+pl(d.t)+'" '+S+'/>';
  if(key!=="po_chintuck"&&key!=="po_tongue") s += '<circle cx="'+d.h[0]+'" cy="'+d.h[1]+'" r="7" '+S+'/>';
  (d.a||[]).forEach(a=>{ s += '<path d="M'+pl(a)+'" '+S+'/>'; });
  (d.l||[]).forEach(a=>{ s += '<path d="M'+pl(a)+'" '+S+'/>'; });
  return s + '</svg>';
}

/* ================= 数据存取 ================= */
let settings = (()=>{ try{ const s=JSON.parse(localStorage.getItem(LS_S));
  if(s&&typeof s==="object") return { mode:(s.mode==="home"||s.mode==="gym")?s.mode:null,
    calorieTarget:+s.calorieTarget>0?Math.round(+s.calorieTarget):2650,
    proteinTarget:+s.proteinTarget>0?Math.round(+s.proteinTarget):140 };
 }catch(e){} return {mode:null,calorieTarget:2650,proteinTarget:140}; })();
function saveSettings(){ localStorage.setItem(LS_S, JSON.stringify(settings)); }
let diet = (()=>{ try{ const d=JSON.parse(localStorage.getItem(LS_D)); if(d&&typeof d==="object"&&!Array.isArray(d)) return d; }catch(e){} return {}; })();
function saveDiet(){ localStorage.setItem(LS_D, JSON.stringify(diet)); }
function dayLog(){ const k=todayKey(); if(!diet[k]||typeof diet[k]!=="object") diet[k]={};
  MEALS.forEach(m=>{ if(!Array.isArray(diet[k][m.id])) diet[k][m.id]=[]; }); return diet[k]; }
function dayTotals(){ const d=dayLog(); let k=0,p=0;
  MEALS.forEach(m=>d[m.id].forEach(e=>{ k+=+e.kcal||0; p+=+e.protein||0; }));
  return {kcal:Math.round(k), protein:Math.round(p)}; }
function visExercises(subId){
  return EXERCISES.filter(e=>e.subId===subId && (e.mode===settings.mode||e.mode==="both"))
    .sort((a,b)=>(LEVEL_ORD[a.level]-LEVEL_ORD[b.level])||a.name.localeCompare(b.name,"zh"));
}
function modeCount(){ return EXERCISES.filter(e=>!e.postureOnly&&(e.mode===settings.mode||e.mode==="both")).length; }

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg;
  t.classList.add("show"); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1800); }
function showModal(html){ document.getElementById("mbox").innerHTML=html;
  document.getElementById("modal").classList.remove("hide"); }
function hideModal(){ document.getElementById("modal").classList.add("hide"); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") hideModal(); });

function topbar(title,right){ return `<header class="topbar"><span class="back" onclick="history.back()">‹</span><h1>${esc(title)}</h1>${right||""}</header>`; }

  </div>`};
}
function pgDiet(){
  const d=dayLog(), t=dayTotals();
  const kp=Math.min(100,Math.round(t.kcal/settings.calorieTarget*100));
  const pp=Math.min(100,Math.round(t.protein/settings.proteinTarget*100));
  const total=MEALS.reduce((n,m)=>n+d[m.id].length,0);
  return {tab:"diet", html:`
  <header class="topbar"><h1>今日饮食</h1><span class="badge">${todayKey().slice(5)} ${weekdayCN()}</span></header>
  <div class="content">
    <div class="g-card">
      <div class="sum-row">
        <div><div class="card-t">热量</div><div class="sum-num ${t.kcal>settings.calorieTarget?"over":""}">${t.kcal} <i>/ ${settings.calorieTarget} kcal</i></div>
          <div class="bar"><i style="width:${kp}%"></i></div></div>
        <div><div class="card-t">蛋白质</div><div class="sum-num ${t.protein>settings.proteinTarget?"over":""}">${t.protein} <i>/ ${settings.proteinTarget} g</i></div>
          <div class="bar"><i style="width:${pp}%"></i></div></div>
      </div>
    </div>
    ${total===0?`<div class="empty">还没有记录，点 + 添加第一餐</div>`:""}
    ${MEALS.map(m=>{
      const items=d[m.id], sub=Math.round(items.reduce((s,e)=>s+(+e.kcal||0),0));
      return `<div class="g-card">
        <div class="meal-head"><b>${m.name}</b><span class="kcal">${sub?sub+" kcal":""}</span><a class="add" href="#/diet/add/${m.id}">+ 添加</a></div>
        ${items.map((e,i)=>{ const f=FOOD_BY_ID[e.foodId];
          return `<div class="mrow"><div class="t" data-m="${m.id}" data-i="${i}"><b>${esc(f?f.name:"未知食物")}</b><span>${e.grams} g</span></div>
          <div class="v">${Math.round(e.kcal)} kcal<span>蛋白 ${Math.round(e.protein)} g</span></div>
          <span class="del" data-m="${m.id}" data-i="${i}">✕</span></div>`; }).join("")}
      </div>`; }).join("")}
  </div>`, after(){
    document.querySelectorAll(".mrow .t").forEach(el=>el.addEventListener("click",()=>openEditGrams(el.dataset.m,+el.dataset.i)));
    document.querySelectorAll(".mrow .del").forEach(el=>el.addEventListener("click",()=>{
      const d2=dayLog(), m=el.dataset.m, i=+el.dataset.i, e=d2[m][i];
      if(!e) return;
      const f=FOOD_BY_ID[e.foodId];
      if(confirm(`删除「${f?f.name:"这条记录"} ${e.grams}g」？`)){ d2[m].splice(i,1); saveDiet(); render(); toast("已删除"); }
    }));
  }};
}
function openEditGrams(meal,idx){
  const d=dayLog(), e=d[meal]&&d[meal][idx]; if(!e) return;
  const f=FOOD_BY_ID[e.foodId];
  showModal(`<h3>修改份量 · ${esc(f?f.name:"")}</h3>
    <input class="inp" id="m-grams" type="number" inputmode="decimal" min="1" value="${e.grams}">
    <div class="m-btns"><button class="btn btn-ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div>`);
  document.getElementById("m-cancel").onclick=hideModal;
  document.getElementById("m-save").onclick=()=>{
    const g=parseFloat(document.getElementById("m-grams").value);
    if(!(g>0)){ toast("请输入大于 0 的克数"); return; }
    if(g>2000 && !confirm("份量超过 2000g，确认输入无误？")) return;
    const ng=Math.round(g);
    if(f){ e.kcal=Math.round(f.kcal*ng/100); e.protein=Math.round(f.protein*ng/100); }
    else if(e.grams>0){ e.kcal=Math.round(e.kcal*ng/e.grams); e.protein=Math.round(e.protein*ng/e.grams); }
    e.grams=ng; saveDiet(); hideModal(); render(); toast("已修改");
  };
}
function pgDietAdd({meal}){
  const m=MEALS.find(x=>x.id===meal); if(!m) return notFound("diet");
  return {tab:"diet", html:topbar("添加到"+m.name)+`
  <div class="content">
    <div class="g-card"><input class="inp" id="s-inp" placeholder="🔍 搜索食物，如：鸡腿" autocomplete="off"></div>
    <div id="s-list"></div>
    <div id="s-detail"></div>
  </div>`, after(){
    const inp=document.getElementById("s-inp"), listEl=document.getElementById("s-list"), detEl=document.getElementById("s-detail");
    function drawList(){
      const kw=inp.value.trim();
      const arr=kw?FOODS.filter(f=>f.name.indexOf(kw)>-1):FOODS;
      if(!arr.length){ listEl.innerHTML=`<div class="empty">食物库未收录「${esc(kw)}」</div>`; return; }
      listEl.innerHTML=arr.map(f=>`<div class="g-card row" data-fid="${f.id}" style="cursor:pointer">
        <div class="t"><b>${esc(f.name)}</b><span>${f.kcal} kcal/100g · 蛋白 ${f.protein} g/100g</span></div><span class="arrow">›</span></div>`).join("");
      listEl.querySelectorAll(".row").forEach(el=>el.addEventListener("click",()=>drawDetail(FOOD_BY_ID[el.dataset.fid])));
    }
    function drawDetail(f){
      listEl.style.display="none"; inp.parentElement.style.display="none";
      detEl.innerHTML=`
        <div class="g-card"><div class="row"><div class="t"><b>${esc(f.name)}</b><span>${f.kcal} kcal/100g · 蛋白 ${f.protein} g/100g</span></div>
          <span class="r-act" id="re-pick" style="color:#ffd9a0;font-size:12px;cursor:pointer;white-space:nowrap">‹ 重选</span></div></div>
        <div class="g-card"><div class="card-t">份量（克）</div>
          <input class="inp" id="g-inp" type="number" inputmode="decimal" min="1" placeholder="输入克数，如 120">
          ${f.presets?`<div style="margin-top:10px">${f.presets.map(p=>`<span class="preset" data-g="${p.grams}">${esc(p.label)}</span>`).join("")}</div>`:""}
        </div>
        <div class="g-card"><div class="card-t">将计入</div><div class="preview" id="pv">选择份量后自动计算</div></div>
        <button class="btn" id="save" disabled>保存到${m.name}</button>`;
      const gInp=document.getElementById("g-inp"), pv=document.getElementById("pv"), saveBtn=document.getElementById("save");
      function upd(){
        const g=parseFloat(gInp.value);
        if(g>0){ const k=Math.round(f.kcal*g/100), p=Math.round(f.protein*g/100);
          pv.innerHTML=`<b>${k}</b> kcal · 蛋白 <b>${p}</b> g`; saveBtn.disabled=false;
        } else { pv.textContent="选择份量后自动计算"; saveBtn.disabled=true; }
      }
      gInp.addEventListener("input",upd);
      detEl.querySelectorAll(".preset").forEach(el=>el.addEventListener("click",()=>{ gInp.value=el.dataset.g; upd(); }));
      document.getElementById("re-pick").onclick=()=>{ detEl.innerHTML=""; listEl.style.display=""; inp.parentElement.style.display=""; };
      if(f.presets&&f.presets.length){ gInp.value=f.presets[0].grams; upd(); }
      saveBtn.onclick=()=>{
        const g=parseFloat(gInp.value);
        if(!(g>0)) return;
        if(g>2000 && !confirm("份量超过 2000g，确认输入无误？")) return;
        const ng=Math.round(g);
        dayLog()[m.id].push({ foodId:f.id, grams:ng,
          kcal:Math.round(f.kcal*ng/100), protein:Math.round(f.protein*ng/100) });
        saveDiet(); location.hash="#/diet"; toast("已加入"+m.name);
      };
    }
    drawList(); inp.addEventListener("input",drawList);
  }};
}
function pgSettings(){
  return {tab:"", html:topbar("设置")+`
  <div class="content">
    <div class="g-card"><div class="card-t">训练版本</div>
      <div class="set-row"><div style="flex:1;min-width:0"><b style="font-size:15px">${MODE_NAME[settings.mode]}</b>
        <div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:2px">切换后动作库立即重新过滤</div></div>
        <button class="btn" id="sw-mode" style="width:auto;padding:10px 14px;font-size:12.5px">切换为${settings.mode==="home"?"健身房版":"居家版"}</button></div></div>
    <div class="g-card"><div class="card-t">每日营养目标</div>
      <div class="set-row" style="margin-bottom:10px"><span style="width:76px;font-size:13px">热量 kcal</span><input class="inp" id="tg-cal" type="number" inputmode="numeric" min="500" value="${settings.calorieTarget}"></div>
      <div class="set-row"><span style="width:76px;font-size:13px">蛋白质 g</span><input class="inp" id="tg-pro" type="number" inputmode="numeric" min="20" value="${settings.proteinTarget}"></div>
      <button class="btn" id="save-tg" style="margin-top:12px">保存目标</button></div>
    <div class="g-card"><div class="card-t">数据备份</div>
      <p style="font-size:12px;color:rgba(255,255,255,.55);line-height:1.7;margin-bottom:12px">数据只保存在本机浏览器中，清理浏览器数据或换手机会丢失，建议定期导出备份。</p>
      <button class="btn" id="exp">导出全部数据（JSON）</button>
      <button class="btn btn-ghost" id="imp">导入备份文件</button>
      <input type="file" id="imp-file" accept="application/json,.json" style="display:none"></div>
    <div class="g-card"><div class="card-t">关于</div>
      <p style="font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.9">健身训练助手 v1.0（动作库 v1.0 · 食物库 v1.0）<br>${EXERCISES.length} 个动作（含 ${EXERCISES.filter(e=>e.postureOnly).length} 个体态矫正）· ${FOODS.length} 种食物<br>纯单机离线应用，除视频外链外无任何网络请求</p></div>
  </div>`, after(){
    document.getElementById("sw-mode").onclick=()=>{
      settings.mode=settings.mode==="home"?"gym":"home"; saveSettings(); render(); toast("已切换为"+MODE_NAME[settings.mode]); };
    document.getElementById("save-tg").onclick=()=>{
      const c=parseInt(document.getElementById("tg-cal").value,10), p=parseInt(document.getElementById("tg-pro").value,10);
      if(!(c>=500&&c<=10000)){ toast("热量目标需在 500-10000 之间"); return; }
      if(!(p>=20&&p<=500)){ toast("蛋白质目标需在 20-500 之间"); return; }
      settings.calorieTarget=c; settings.proteinTarget=p; saveSettings(); render(); toast("目标已保存"); };
    document.getElementById("exp").onclick=()=>{
      const data={app:"fitness-trainer",version:1,exportedAt:new Date().toISOString(),settings,diet};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="健身训练助手备份-"+todayKey()+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("已导出备份文件"); };
    document.getElementById("imp").onclick=()=>document.getElementById("imp-file").click();
    document.getElementById("imp-file").onchange=ev=>{
      const file=ev.target.files[0]; if(!file) return;
      const rd=new FileReader();
      rd.onload=()=>{ try{
          const obj=JSON.parse(rd.result);
          if(!validBackup(obj)) throw new Error("bad");
          if(!confirm("导入将覆盖当前全部数据（版本 / 目标 / 饮食记录），确认导入？")) return;
          settings={ mode:(obj.settings.mode==="home"||obj.settings.mode==="gym")?obj.settings.mode:null,
            calorieTarget:Math.round(+obj.settings.calorieTarget), proteinTarget:Math.round(+obj.settings.proteinTarget) };
          diet=obj.diet||{}; saveSettings(); saveDiet();
          location.hash="#/home"; render(); toast("导入成功");
        }catch(err){ toast("文件格式非法，已取消导入"); }
        ev.target.value=""; };
      rd.readAsText(file); };
  }};
}
function validBackup(o){
  if(!o||typeof o!=="object") return false;
  const s=o.settings;
  if(!s||typeof s!=="object") return false;
  if(!(s.mode===null||s.mode==="home"||s.mode==="gym")) return false;
  if(!(+s.calorieTarget>0)||!(+s.proteinTarget>0)) return false;
  if(o.diet!==undefined){
    if(!o.diet||typeof o.diet!=="object"||Array.isArray(o.diet)) return false;
    for(const k of Object.keys(o.diet)){
      const day=o.diet[k]; if(!day||typeof day!=="object") return false;
      for(const m of ["breakfast","lunch","dinner","snack"]){
        if(day[m]===undefined) continue;
        if(!Array.isArray(day[m])) return false;
        for(const e of day[m]){
          if(!e||typeof e.foodId!=="string"||!(+e.grams>0)||!(+e.kcal>=0)||!(+e.protein>=0)) return false;
        }
      }
    }
  }
  return true;
}

/* ================= 路由 ================= */
const ROUTES=[
  {p:["onboarding"],f:pgOnboarding},
  {p:["home"],f:pgHome},
  {p:["train"],f:pgTrain},
  {p:["train",":part"],f:pgPart},
  {p:["train",":part",":sub"],f:pgSub},
  {p:["exercise",":id"],f:pgExercise},
  {p:["posture"],f:pgPosture},
  {p:["posture",":id"],f:pgPostureDetail},
  {p:["diet"],f:pgDiet},
  {p:["diet","add",":meal"],f:pgDietAdd},
  {p:["settings"],f:pgSettings}
];
function matchRoute(seg){
  for(const r of ROUTES){
    if(r.p.length!==seg.length) continue;
    const params={}; let ok=true;
    for(let i=0;i<r.p.length;i++){
      const pat=r.p[i];
      if(pat[0]===":") params[pat.slice(1)]=decodeURIComponent(seg[i]);
      else if(pat!==seg[i]){ ok=false; break; }
    }
    if(ok) return {f:r.f, params};
  }
  return null;
}
function render(){
  const seg=(location.hash||"").replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!settings.mode){
    if(seg[0]!=="onboarding"){ location.replace("#/onboarding"); return; }
  } else if(seg.length===0){ location.replace("#/home"); return; }
  const m=matchRoute(seg);
  if(!m){ location.replace(settings.mode?"#/home":"#/onboarding"); return; }
  const r=m.f(m.params);
  document.getElementById("app").innerHTML=r.html;
  renderDock(r.tab, r.dock!==false);
  window.scrollTo(0,0);
  if(r.after) r.after();
}
window.addEventListener("hashchange", render);
render();

// 注册 Service Worker，实现离线缓存（部署到 HTTPS 后生效）
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
